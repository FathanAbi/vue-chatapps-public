# SEC-004: dedicated upload origin.
#
# Uploaded files are served from a *separate origin* (media.example.com) so a
# stored file can never execute script in the API/Admin origin, where the
# session cookie and the Admin Panel live. This is the deployment-level half
# of the SEC-004 remediation; the code-level half is in
# `payload-be/src/collections/Media.ts` (type allow-list, size cap, and the
# `nosniff` / sandbox-CSP / `Content-Disposition` response headers).
#
# Install to: /etc/nginx/conf.d/media-origin.conf
#
# Prerequisites:
#   1. A DNS A record `media.example.com` -> the VPS IP.
#   2. A TLS certificate covering `media.example.com`
#      (certbot: `sudo certbot certonly --nginx -d media.example.com`).
#   3. The Payload container reachable on the Docker bridge (127.0.0.1:3000).
#
# The file is self-contained: it declares its own rate-limit zones with
# `media_`-prefixed names so it can be installed alongside the main vhost
# without colliding with the zones declared there.

limit_req_zone $binary_remote_addr zone=media_file:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=media_conn_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name media.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.example.com;

    ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 2m;

    # SEC-004: the upload origin must never be able to run script, frame
    # content or reach back into the API origin.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "sandbox; default-src 'none'; script-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    limit_conn media_conn_per_ip 20;

    # Only the file-serving route is exposed on this origin. The upload
    # endpoint itself stays on the API origin, behind its own rate limit.
    #
    # `proxy_pass` targets the Payload container directly (127.0.0.1:3000), not
    # the API vhost, so the API vhost's redirect to this origin cannot loop.
    location /media/file/ {
        limit_req zone=media_file burst=40 nodelay;

        proxy_pass         http://127.0.0.1:3000/api/media/file/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # Payload's own `access.read` still applies: an anonymous request for
        # a stored file is rejected with 401/403 by the application.
        proxy_pass_request_headers on;
    }

    # Nothing else lives on this origin.
    location / {
        return 404;
    }
}

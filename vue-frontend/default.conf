# SEC-014 / SEC-012: TLS-terminating vhost for the SPA with the full browser
# security header set. Terminates HTTPS and redirects plain HTTP.
#
# The certificate paths are mounted by the deployment (see deployment-guide.md).
# Replace `app.example.com` and the certificate paths with the real values.

# --- A8: rate limiting zones ------------------------------------------------
# General API traffic: ~10 requests/second per IP with a small burst.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
# Login: 5 requests/minute per IP (brute-force / credential stuffing).
limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
# Registration: 3 requests/hour per IP.
limit_req_zone $binary_remote_addr zone=api_register:10m rate=3r/h;
# Uploads: 10 requests/hour per IP.
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=10r/h;
# SEC-013: user directory search. Bounded so it cannot be used for bulk
# username enumeration.
limit_req_zone $binary_remote_addr zone=api_directory:10m rate=20r/m;
# Concurrent connections per IP.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name app.example.com;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # SEC-014: browser security headers on the SPA origin.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.example.com; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    # SEC-009: bound the request body at the edge.
    client_max_body_size 2m;

    # A8: cap concurrent connections per IP.
    limit_conn conn_per_ip 20;

    # --- API: proxied to the Payload backend ---------------------------------
    location /api/auth/login {
        limit_req zone=api_login burst=3 nodelay;
        proxy_pass http://payload:3000;
        include /etc/nginx/proxy_params.inc;
    }

    location = /api/penggunas/login {
        limit_req zone=api_login burst=3 nodelay;
        proxy_pass http://payload:3000;
        include /etc/nginx/proxy_params.inc;
    }

    # SEC-013: search-based user directory. Kept separate from the generic
    # `/api/` location so it gets a stricter limit; declared before the prefix
    # block so this exact match wins.
    location = /api/penggunas/directory {
        limit_req zone=api_directory burst=5 nodelay;
        proxy_pass http://payload:3000;
        include /etc/nginx/proxy_params.inc;
    }

    location = /api/penggunas {
        limit_req zone=api_register burst=2 nodelay;
        proxy_pass http://payload:3000;
        include /etc/nginx/proxy_params.inc;
    }

    location /api/media {
        limit_req zone=api_upload burst=3 nodelay;
        proxy_pass http://payload:3000;
        include /etc/nginx/proxy_params.inc;
    }

    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://payload:3000;
        include /etc/nginx/proxy_params.inc;
    }

    # SEC-018: the admin panel is not part of the public SPA surface.
    location /admin {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        try_files $uri =404;

        # `expires` is used rather than `add_header Cache-Control` because an
        # `add_header` in a nested `location` block *replaces* every inherited
        # `add_header`, which would drop the security headers above for
        # static assets.
        expires 1y;
    }

    error_page 404 /index.html;
}
